#
# MDS-enabled build configuration for the Bluetooth HIDS mouse sample.
#

CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_HIDS_mouse"
CONFIG_BT_DEVICE_APPEARANCE=962

# Connection interval settings (unit: 1.25ms)
# Min interval: 6 units = 7.5ms (for low latency HID devices)
# Max interval: 6 units = 7.5ms
# Latency: 30 (can skip up to 30 connection events)
# Timeout: 400 units = 4000ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Disable automatic initiation of PHY updates and the SMP Security Requests.
# Workaround to prevent disconnection with the following disconnect reasons:
# - 0x08 (BT_HCI_ERR_CONN_TIMEOUT)
# - 0x13 (BT_HCI_ERR_REMOTE_USER_TERM_CONN)
# - 0x23 (BT_HCI_ERR_LL_PROC_COLLISION)
# - 0x2A (BT_HCI_ERR_DIFF_TRANS_COLLISION)
# Some laptop Bluetooth controllers may simultaneously trigger two Link Layer
# procedures which results in a procedure collision and disconnection.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_BT_BAS=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_BT_CONN_CTX=y

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="NordicSemiconductor"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_DK_LIBRARY=y
CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_BT_PRIVACY=y

# Memfault Diagnostic Service.
CONFIG_BT_MDS=y
# How often MDS polls for pending Memfault data. This only gates the start of a
# polling round -- once data is found, chunks are sent back to back -- so after a
# crash the coredump can sit in RRAM for up to this long before the first chunk
# goes out. Lower it (e.g. 5000) when debugging the upload path.
CONFIG_BT_MDS_DATA_POLL_INTERVAL=60000
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# MCUmgr SMP over Bluetooth, used by nRF Connect Device Manager.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y

# Persistent bonding/settings for encrypted HIDS and MDS access.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# Memfault SDK.
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=n

# Heap memory is required for memfault_demo_cli.c.
CONFIG_HEAP_MEM_POOL_SIZE=256

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=4096
CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_RRAM=y

# Replace this placeholder with the project key from your Memfault project.
CONFIG_MEMFAULT_NCS_PROJECT_KEY="rDREudFmeF6jo4SLCZTZLsPqP4HikMSO"
# Derive the Memfault device ID from hardware so every board reports a distinct
# identity without editing Kconfig per unit.
#
# MEMFAULT_NCS_DEVICE_ID_{STATIC,HW_ID,RUNTIME,...} are members of one Kconfig
# choice, so exactly one may be set. Setting two silently drops the first and
# keeps the last. RUNTIME in particular leaves device_serial as an empty string
# until the application calls memfault_ncs_device_id_set(), which this sample
# does not do -- an empty serial makes the MDS Data URI unusable and the gateway
# app reports "NETWORK UNAVAILABLE".
#
# The hw_id source also decides the serial length, which has to fit the MDS URI
# budget: "https://chunks.memfault.com/api/v0/chunks/" is 42 chars against a
# 64-char CONFIG_BT_MDS_MAX_URI_LENGTH, leaving 22 for the serial. DEVICE_ID
# yields 16 hex chars (58 total, fits); HW_ID_LIBRARY_SOURCE_UUID would yield 36
# and trip the "Too long URI" path in the MDS service.
# CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
# CONFIG_MEMFAULT_NCS_DEVICE_ID="nrf-hids-mouse"
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

CONFIG_MEMFAULT_NCS_BT_METRICS=y
